[project]
name = "realtime-stt"
version = "0.1.0"
description = "Phụ đề tiếng Việt realtime: Whisper + lọc PII + Gemini qua Databricks serving endpoint"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "databricks-sdk>=0.20",
]

[project.optional-dependencies]
gradio = ["gradio>=5.20,<6"]
audio = ["soundfile"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.abc.com/repository/pypi-proxy/simple"
default = true
